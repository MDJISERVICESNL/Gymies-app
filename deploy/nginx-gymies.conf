# Nginx: Gymies = hoofdsite op / ; API via Laravel op /api
# Domein: gymies.nl (DNS A-record moet wijzen naar server-IP)
# Deploy schrijft naar: /var/www/gymies/public (deploy_all.sh / sync_gymies_web.sh)
# SSL: Certbot-certificaat in /etc/letsencrypt/live/gymies.nl/
# Toepassen: SSH_TARGET=gymies ./scripts/apply_nginx_gymies_on_server.sh

# HTTP → redirect naar HTTPS (behoud .well-known voor Certbot-renewal)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name gymies.nl www.gymies.nl;
    root /var/www/gymies/public;
    location /.well-known/acme-challenge/ {
        try_files $uri =404;
    }
    # gymies.nl → www; www → https
    if ($host = gymies.nl) {
        return 301 https://www.gymies.nl$request_uri;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: gymies.nl → redirect naar www (consistentie; voorkomt 401 auth-problemen)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name gymies.nl;
    ssl_certificate /etc/letsencrypt/live/gymies.nl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gymies.nl/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://www.gymies.nl$request_uri;
}

# HTTPS: www.gymies.nl = hoofdsite
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name www.gymies.nl;
    root /var/www/gymies/public;

    ssl_certificate /etc/letsencrypt/live/gymies.nl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gymies.nl/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    index index.html index.php;

    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml application/xml+rss image/svg+xml;

    # API: alles onder /api naar Laravel
    # Belangrijk: capture auth-headers VÓÓR try_files (interne redirect verliest ze anders)
    location /api/ {
        set $api_auth $http_authorization;
        set $api_x_token $http_x_gymies_token;
        set $api_x_auth $http_x_authorization;
        try_files $uri $uri/ @api_to_php;
    }
    location @api_to_php {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $request_uri;
        include fastcgi_params;
        set $fwd $http_x_forwarded_for;
        if ($fwd = "") { set $fwd $remote_addr; }
        fastcgi_param HTTP_X_FORWARDED_FOR $fwd;
        fastcgi_param HTTP_X_REAL_IP $remote_addr;
        fastcgi_param HTTP_AUTHORIZATION $api_auth;
        fastcgi_param HTTP_X_GYMIES_TOKEN $api_x_token;
        fastcgi_param HTTP_X_AUTHORIZATION $api_x_auth;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300;
        fastcgi_buffering on;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
    }

    # WebSocket: Laravel Reverb (chat realtime)
    location /app {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Hoofdsite: Flutter SPA op / (statische bestanden + index.html voor routes)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html niet cachen (SPA-updates direct zichtbaar)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Flutter bootstrap/loader niet cachen (anders blijft oude app laden)
    location = /flutter_bootstrap.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /flutter.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Statische assets lang cachen
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot|otf|webmanifest|wasm)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
    # Sitemap: dynamisch via Laravel (statische pagina's + trainer-profielen)
    location = /sitemap.xml {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI /sitemap.xml;
        include fastcgi_params;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        # Client-IP doorgeven voor admin IP-allowlist (vault-console); bestaande X-Forwarded-For niet overschrijven
        set $fwd $http_x_forwarded_for;
        if ($fwd = "") { set $fwd $remote_addr; }
        fastcgi_param HTTP_X_FORWARDED_FOR $fwd;
        fastcgi_param HTTP_X_REAL_IP $remote_addr;
        # Auth headers: standaard fastcgi_params geeft Authorization niet door; X-Gymies-Token als fallback
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_param HTTP_X_GYMIES_TOKEN $http_x_gymies_token;
        fastcgi_param HTTP_X_AUTHORIZATION $http_x_authorization;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300;
        fastcgi_buffering on;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
    }
}
